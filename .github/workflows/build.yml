name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Set up compile-only placeholder configuration
        run: cp firmware/include/secrets.h.example firmware/include/secrets.h
      - name: Compile M5StickC Plus firmware
        run: pio run -d firmware

  xiao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile XIAO ESP32S3 Sense standalone firmware
        run: pio run -d xiao-voice-recorder

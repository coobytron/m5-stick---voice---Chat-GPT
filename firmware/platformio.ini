; Original M5StickC Plus 1.1 (not Plus2)
; Default environment retains the original Wi-Fi-to-Mac receiver.
[env:m5stickc-plus-11]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.23
  m5stack/M5GFX@^0.2.31
build_flags =
  -D CORE_DEBUG_LEVEL=1
build_src_filter =
  +<main.cpp>
  -<sd_recorder.cpp>

; Offline microSD recorder: no Wi-Fi credentials, Mac or iPhone needed.
[env:m5stickc-plus-11-sd]
extends = env:m5stickc-plus-11
build_src_filter =
  +<sd_recorder.cpp>
  -<main.cpp>

[env:xiao_esp32s3_sense]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SD_CS_PIN=21
; Some Sense expansion revisions may route CS to GPIO3.
; Check your module's schematic before changing SD_CS_PIN.
